<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000814" />
    <title>Offline | Tamim Hasan Portfolio</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #010711;
        --card: #06111e;
        --cyan: #67e8f9;
        --blue: #60a5fa;
        --text: #f8fafc;
        --muted: #94a3b8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top left, rgba(37, 99, 235, 0.18), transparent 38%),
          radial-gradient(circle at bottom right, rgba(6, 182, 212, 0.14), transparent 38%),
          var(--bg);
        color: var(--text);
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .card {
        width: 100%;
        max-width: 460px;
        border: 1px solid rgba(103, 232, 249, 0.18);
        border-radius: 24px;
        background: var(--card);
        padding: 36px 28px;
        text-align: center;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
      }
      .badge {
        display: inline-block;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--cyan);
      }
      h1 {
        margin: 14px 0 10px;
        font-size: clamp(22px, 5vw, 28px);
        line-height: 1.25;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.7;
      }
      .actions {
        margin-top: 26px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
      }
      a, button {
        min-height: 44px;
        padding: 0 22px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        font-family: inherit;
      }
      .primary {
        border: 1px solid rgba(103, 232, 249, 0.35);
        background: rgba(103, 232, 249, 0.12);
        color: var(--cyan);
      }
      .secondary {
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: transparent;
        color: var(--muted);
      }
      a:focus-visible, button:focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge">Connection lost</span>
      <h1>You&rsquo;re offline right now</h1>
      <p>
        This page needs a network connection. Check your internet and try again &mdash;
        any pages you already visited are still available.
      </p>
      <div class="actions">
        <button type="button" class="primary" onclick="location.reload()">Try again</button>
        <a class="secondary" href="/home">Go to portfolio</a>
      </div>
    </main>
  </body>
</html>
